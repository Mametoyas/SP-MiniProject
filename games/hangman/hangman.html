<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANGMAN - Game Boy Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/games/hangman/hangman.css">
</head>
<body>

  <a class="back-btn" href="/">◀ MENU</a>

  <h1>☠ HANGMAN ☠</h1>
  <p class="subtitle">GAME BOY EDITION</p>

  <div class="game-container">

    <!-- Info row -->
    <div class="info-row">
      <div id="category-label">CATEGORY: —</div>
      <div class="lives-hearts" id="hearts"></div>
    </div>

    <!-- Hangman SVG + Wrong letters (side by side) -->
    <div class="mid-row">
      <div class="pixel-box hangman-box">
        <svg id="hangman-svg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
          <!-- Gallows (always visible) -->
          <line x1="20"  y1="170" x2="160" y2="170"/>
          <line x1="60"  y1="170" x2="60"  y2="10"/>
          <line x1="60"  y1="10"  x2="120" y2="10"/>
          <line x1="120" y1="10"  x2="120" y2="35"/>
          <!-- Body parts (hidden until wrong guess) -->
          <circle class="part" id="p-head" cx="120" cy="50"  r="15"/>
          <line   class="part" id="p-body" x1="120" y1="65"  x2="120" y2="110"/>
          <line   class="part" id="p-larm" x1="120" y1="75"  x2="95"  y2="95"/>
          <line   class="part" id="p-rarm" x1="120" y1="75"  x2="145" y2="95"/>
          <line   class="part" id="p-lleg" x1="120" y1="110" x2="95"  y2="140"/>
          <line   class="part" id="p-rleg" x1="120" y1="110" x2="145" y2="140"/>
        </svg>
      </div>

      <div class="pixel-box wrong-box">
        <div class="wrong-label">WRONG LETTERS<br>ตัวที่เดาผิด</div>
        <div class="wrong-letters" id="wrong-display">—</div>
      </div>
    </div>

    <!-- Word display -->
    <div class="pixel-box">
      <div class="word-row" id="word-display"></div>
    </div>

    <!-- Keyboard -->
    <div class="pixel-box">
      <div class="keyboard" id="keyboard"></div>
    </div>

  </div>

  <!-- Win / Lose overlay -->
  <div id="message-overlay">
    <div id="message-title"></div>
    <div id="message-word"></div>
    <button class="btn" id="play-again-btn">▶ PLAY AGAIN / เล่นอีกครั้ง</button>
  </div>

  <script src="/games/hangman/hangman.js"></script>
</body>
</html>
